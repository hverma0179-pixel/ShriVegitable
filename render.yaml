services:
  - type: web
    name: shri-vegetables
    env: node
    rootDir: .
    buildCommand: npm ci --workspaces && npm run build --workspace=client
    startCommand: npm run start --workspace=server
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@shrivegetables.in
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
