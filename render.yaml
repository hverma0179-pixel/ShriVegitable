services:
  - type: web
    name: shri-vegetables
    env: node
    rootDir: .
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install && cp -r ../client/dist ./dist
    startCommand: cd server && npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@shrivegetables.in
      - key: ADMIN_PASSWORD
        sync: false
