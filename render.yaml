services:
  - type: web
    name: shri-vegetables
    env: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@shrivegetables.in
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production