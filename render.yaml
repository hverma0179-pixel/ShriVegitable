services:
  - type: web
    name: shri-vegetables
    env: node
    rootDir: .
    buildCommand: npm ci && cd client && npm ci && npm run build && cd ../server && npm ci && cp -r ../client/dist ./dist
    startCommand: cd server && node src/index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@shrivegetables.in
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
